<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- =========================================================
       1. EDIT TITLE DI BAWAH INI (Muncul di Tab Browser & WA)
       ========================================================= -->
  <title>Nama Aplikasi Anda</title>
  <meta property="og:title" content="Nama Aplikasi Anda">
  <meta property="og:description" content="Silakan klik untuk membuka aplikasi operasional.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h1 id="app-title">Nama Aplikasi Anda</h1>
    <p>Sedang menghubungkan ke sistem aplikasi, mohon tunggu sebentar...</p>
    <a id="manual-link" href="#" class="btn">Buka Aplikasi Sekarang</a>
  </div>

  <script>
    // =========================================================
    // 2. KONFIGURASI UTAMA (EDIT BAGIAN INI SAJA)
    // =========================================================
    const CONFIG = {
      // Ubah judul aplikasi di sini (otomatis mengubah <title> & teks di layar)
      pageTitle: "Dashboard LP",

      // Tempel URL Web App Google Apps Script (/exec) Anda di sini
      appsScriptUrl: "https://script.google.com/macros/s/AKfycbxZvOENeqzkLdcnsV0fOfR-1Oi2HzlxQBgnCpxWAqazHzBWojVKgzSsRV_Ta-HRPuC_fg/exec",

      // Jeda redirect dalam milidetik (0 = langsung pindah seketika)
      redirectDelayMs: 300
    };

    // Terapkan judul & link ke elemen HTML
    document.title = CONFIG.pageTitle;
    document.getElementById("app-title").textContent = CONFIG.pageTitle;
    document.getElementById("manual-link").href = CONFIG.appsScriptUrl;

    // Redirect langsung agar tidak diblokir X-Frame-Options Google
    setTimeout(() => {
      window.location.replace(CONFIG.appsScriptUrl);
    }, CONFIG.redirectDelayMs);
  </script>

</body>
</html>
